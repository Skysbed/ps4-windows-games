name: PcPs4 OpenOrbis build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenOrbis v0.5.4 LLVM 18 toolchain
        env:
          OPENORBIS_VERSION: v0.5.4
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/$OPENORBIS_VERSION/toolchain-llvm-18.tar.gz" |
            tar -xz --strip-components=2 -C "$GITHUB_WORKSPACE/toolchain"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/toolchain" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make python3

      - name: Test translation layer
        run: make test

      - name: Test PE loader (host)
        run: make test-host

      - name: Build native Windows D3D11 smoke binary
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          mkdir -p build
          x86_64-w64-mingw32-gcc \
            -std=c11 \
            -O2 \
            -ffreestanding \
            -fno-stack-protector \
            -fno-asynchronous-unwind-tables \
            -nostdlib \
            -fno-builtin \
            -Wl,--entry=WinMainCRTStartup \
            -Wl,--subsystem,windows \
            -Wl,--section-alignment,0x4000 \
            -Wl,--file-alignment,0x200 \
            -o build/win_d3d11_smoke.exe \
            tests/win_d3d11_smoke.c \
            -ld3d11 -lkernel32 -lws2_32 -lxinput -lmsvcrt

      - name: Build native Windows local DLL smoke binary
        run: |
          mkdir -p build
          x86_64-w64-mingw32-gcc \
            -std=c11 \
            -O2 \
            -ffreestanding \
            -fno-stack-protector \
            -fno-asynchronous-unwind-tables \
            -nostdlib \
            -fno-builtin \
            -shared \
            -Wl,--entry=DllMain \
            -Wl,--subsystem,windows \
            -Wl,--section-alignment,0x4000 \
            -Wl,--file-alignment,0x200 \
            -o build/pcps4_local_smoke.dll \
            tests/win_local_dll_smoke.c

      - name: Inspect native Windows smoke import surface
        run: |
          x86_64-w64-mingw32-objdump -p build/win_d3d11_smoke.exe |
            sed -n '/The Import Tables/,+140p'
          x86_64-w64-mingw32-objdump -p build/pcps4_local_smoke.dll |
            grep -q "PcPs4LocalProbe" || {
              echo "ERROR: local DLL export is missing"
              exit 1
            }
          for dll in KERNEL32.dll d3d11.dll WS2_32.dll XINPUT1_4.dll MSVCRT.dll; do
            x86_64-w64-mingw32-objdump -p build/win_d3d11_smoke.exe |
              grep -qi "$dll" || {
                echo "ERROR: expected smoke import $dll is missing"
                exit 1
              }
          done


      - name: Verify OpenOrbis installation and packaging tools
        run: |
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f "$OO_PS4_TOOLCHAIN/lib/crt1.o"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

      - name: Upload native Windows compatibility smoke binaries
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-Windows-Compatibility-Smoke
          path: |
            build/win_d3d11_smoke.exe
            build/pcps4_local_smoke.dll
          if-no-files-found: error

      - name: Upload native Windows D3D11 smoke binary
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-Windows-D3D11-Smoke
          path: build/win_d3d11_smoke.exe
          if-no-files-found: error

      - name: Translate, build and package
        run: PCPS4_ENABLE_OPENGNM=0 make pkg

      - name: Upload installable PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-PKG
          path: build/package/*.pkg
          if-no-files-found: error

      - name: Upload eboot
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-eboot
          path: eboot.bin
          if-no-files-found: error

      - name: Package native Windows D3D11 smoke binary for PS4
        run: |
          mkdir -p build/win-game
          cp build/win_d3d11_smoke.exe build/win-game/game.exe
          cp build/pcps4_local_smoke.dll build/win-game/pcps4_local_smoke.dll
          PCPS4_BUNDLED_GAME=1 \
          PCPS4_GAME_DIR="$GITHUB_WORKSPACE/build/win-game" \
          INTDIR=build/win-smoke \
          PACKAGE_ROOT=build/win-smoke/package \
          TITLE="PcPs4 Windows D3D11 Smoke" \
          TITLE_ID=PCPS00002 \
          CONTENT_ID=IV0000-PCPS00002_00-WIND3D11SMOKE001 \
          make pkg

      - name: Upload PS4 package containing native Windows D3D11 smoke binary
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-PKG-Windows-D3D11-Smoke
          path: build/win-smoke/package/*.pkg
          if-no-files-found: error

      - name: Upload translated source and report
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-translated-source
          path: |
            build/generated/*.c
            build/generated/*.cpp
            build/translation.json
          if-no-files-found: error