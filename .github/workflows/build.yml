name: PcPs4 OpenOrbis build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenOrbis v0.5.4 LLVM 18 toolchain
        env:
          OPENORBIS_VERSION: v0.5.4
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/$OPENORBIS_VERSION/toolchain-llvm-18.tar.gz" |
            tar -xz --strip-components=2 -C "$GITHUB_WORKSPACE/toolchain"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/toolchain" >> "$GITHUB_ENV"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make python3 python3-pip python3-mako ninja-build glslang-tools git

      - name: Upgrade Meson
        run: python3 -m pip install --user 'meson>=1.0'

      - name: Prepare PS4 graphics stack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/external/ps4-graphics"
          git clone --depth 1 https://github.com/PS4-OpenGNM/opengnm.git             "$GITHUB_WORKSPACE/external/ps4-graphics/opengnm"
          git clone --depth 1 https://github.com/PS4-OpenGNM/opengnm-psbc.git             "$GITHUB_WORKSPACE/external/ps4-graphics/opengnm-psbc"
          git clone --depth 1 https://github.com/doitsujin/dxbc-spirv.git             "$GITHUB_WORKSPACE/external/ps4-graphics/dxbc-spirv"
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git             "$GITHUB_WORKSPACE/external/ps4-graphics/Vulkan-Headers"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git             "$GITHUB_WORKSPACE/external/ps4-graphics/SPIRV-Headers"

          cd "$GITHUB_WORKSPACE/external/ps4-graphics/opengnm"
          cp config.orbis.mak config.mak
          make CC=clang AR=ar -j2

          cd "$GITHUB_WORKSPACE/external/ps4-graphics/dxbc-spirv"
          meson setup builddir -Denable_tools=true
          ninja -C builddir

          cd "$GITHUB_WORKSPACE/external/ps4-graphics/opengnm-psbc"
          make -j2
          make -f Makefile.orbis -j2

      - name: Build PS4 smoke shaders
        run: |
          python3 tools/pcps4_shader_pipeline.py             --kind glsl             --stage vertex             --input pc_source/shaders/tri.vert.glsl             --output build/package/assets/shaders/tri.vert.sb             --psbc external/ps4-graphics/opengnm-psbc/opengnm-psbc
          python3 tools/pcps4_shader_pipeline.py             --kind glsl             --stage fragment             --input pc_source/shaders/tri.frag.glsl             --output build/package/assets/shaders/tri.frag.sb             --psbc external/ps4-graphics/opengnm-psbc/opengnm-psbc

      - name: Test translation layer
        run: make test

      - name: Verify OpenOrbis installation and packaging tools
        run: |
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f "$OO_PS4_TOOLCHAIN/lib/crt1.o"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

      - name: Translate, build and package
        run: PCPS4_ENABLE_OPENGNM=1 make pkg

      - name: Upload installable PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-PKG
          path: build/package/*.pkg
          if-no-files-found: error

      - name: Upload eboot
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-eboot
          path: eboot.bin
          if-no-files-found: error

      - name: Upload translated source and report
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-translated-source
          path: |
            build/generated/*.c
            build/generated/*.cpp
            build/translation.json
          if-no-files-found: error