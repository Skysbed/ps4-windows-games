name: PcPs4 v46 Core OpenOrbis build (DXVK package requires external GPU libraries)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OPENORBIS_VERSION: v0.5.4
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/toolchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld make python3 mingw-w64 binutils-mingw-w64-x86-64

      - name: Download OpenOrbis LLVM 18 toolchain
        run: |
          set -euxo pipefail
          rm -rf "$OO_PS4_TOOLCHAIN" toolchain.tar.gz
          mkdir -p "$OO_PS4_TOOLCHAIN"
          curl -fL --retry 4 --retry-all-errors --retry-delay 2             "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/$OPENORBIS_VERSION/toolchain-llvm-18.tar.gz"             -o toolchain.tar.gz
          tar -tzf toolchain.tar.gz >/dev/null
          tar -xzf toolchain.tar.gz --strip-components=2 -C "$OO_PS4_TOOLCHAIN"
          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f "$OO_PS4_TOOLCHAIN/lib/crt1.o"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          rm -f toolchain.tar.gz

      - name: Print build environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          clang --version
          ld.lld --version
          make --version | sed -n '1p'
          python3 --version
          x86_64-w64-mingw32-gcc --version | sed -n '1p'
          printf 'OpenOrbis tools:\n'
          ls -lh "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"                 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"                 "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

      - name: Run translation and host tests
        run: |
          set -euxo pipefail
          make test
          make test-host
          make test-dxvk-syntax

      - name: Build native Windows D3D11 smoke + DLL probe
        run: |
          set -euxo pipefail
          rm -rf build/win_d3d11_smoke.exe build/winprobe.dll
          mkdir -p build
          x86_64-w64-mingw32-gcc             -std=c11 -O2 -ffreestanding             -fno-stack-protector -fno-asynchronous-unwind-tables             -nostdlib             -Wl,--entry=WinMainCRTStartup             -Wl,--subsystem,windows             -Wl,--section-alignment,0x4000             -Wl,--file-alignment,0x200             -o build/win_d3d11_smoke.exe             tests/win_d3d11_smoke.c -ld3d11 -ldxgi -lkernel32

          x86_64-w64-mingw32-gcc             -std=c11 -O2 -ffreestanding             -fno-stack-protector -fno-asynchronous-unwind-tables             -nostdlib -shared             -Wl,--entry=DllMain             -Wl,--section-alignment,0x4000             -Wl,--file-alignment,0x200             -o build/winprobe.dll             tests/winprobe.c

          test -s build/win_d3d11_smoke.exe
          test -s build/winprobe.dll
          file build/win_d3d11_smoke.exe build/winprobe.dll

          echo '--- smoke imports ---'
          x86_64-w64-mingw32-objdump -p build/win_d3d11_smoke.exe |
            sed -n '/The Import Tables/,$p' | head -n 120

          echo '--- probe exports ---'
          x86_64-w64-mingw32-objdump -p build/winprobe.dll |
            sed -n '/The Export Tables/,$p' | head -n 120

      - name: Upload native Windows D3D11 smoke binary
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-Windows-D3D11-Smoke-EXE
          path: build/win_d3d11_smoke.exe
          if-no-files-found: error

      - name: Build and package base PS4 executable
        run: |
          set -euxo pipefail
          PCPS4_ENABLE_OPENGNM=0           PCPS4_RUN_GAME=1           make -B pkg
          test -s build/package/*.gp4
          test -s build/package/*.pkg
          test -s eboot.bin

      - name: Validate base package contents
        run: |
          set -euxo pipefail
          echo '--- base package tree ---'
          find build/package -maxdepth 4 -type f -printf '%P %s bytes\n' | sort
          test -f build/package/eboot.bin
          test -f build/package/sce_sys/param.sfo
          test -f build/package/sce_sys/icon0.png
          test -f build/package/sce_sys/about/right.sprx
          test -f build/package/sce_module/libc.prx
          test -f build/package/sce_module/libSceFios2.prx
          test -s build/package/*.pkg
          test -s build/package/*.gp4

      - name: Upload installable base PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-PKG
          path: build/package/*.pkg
          if-no-files-found: error

      - name: Upload base GP4 and eboot
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-PKG-Diagnostics
          path: |
            build/package/*.gp4
            eboot.bin
          if-no-files-found: error

      - name: Stage and package bundled Windows D3D11 smoke executable
        run: |
          set -euxo pipefail
          rm -rf build/win-game build/win-smoke
          mkdir -p build/win-game
          cp build/win_d3d11_smoke.exe build/win-game/game.exe
          cp build/winprobe.dll build/win-game/winprobe.dll
          test -s build/win-game/game.exe
          test -s build/win-game/winprobe.dll

          PCPS4_ENABLE_OPENGNM=0           PCPS4_RUN_GAME=1           PCPS4_BUNDLED_GAME=1           PCPS4_GAME_DIR="$GITHUB_WORKSPACE/build/win-game"           INTDIR=build/win-smoke           PACKAGE_ROOT=build/win-smoke/package           TITLE="PcPs4 Windows D3D11 Smoke"           TITLE_ID=PCPS00002           CONTENT_ID=IV0000-PCPS00002_00-WIND3D11SMOKE001           make -B pkg

      - name: Validate bundled Windows PE package
        run: |
          set -euxo pipefail
          echo '--- bundled package tree ---'
          find build/win-smoke/package -maxdepth 6 -type f -printf '%P %s bytes\n' | sort
          test -f build/win-smoke/package/game/game.exe
          test -s build/win-smoke/package/game/game.exe
          test -f build/win-smoke/package/game/winprobe.dll
          test -s build/win-smoke/package/game/winprobe.dll
          test -s build/win-smoke/package/*.gp4
          test -s build/win-smoke/package/*.pkg

          GP4="$(find build/win-smoke/package -maxdepth 1 -name '*.gp4' -type f -print -quit)"
          echo '--- bundled GP4 ---'
          sed -n '1,220p' "$GP4"
          grep -Eq 'game/game\\.exe|game/game.exe' "$GP4"

          # Versioned filename keeps downloads unmistakable.
          cp "$(find build/win-smoke/package -maxdepth 1 -name '*.pkg' -type f -print -quit)" "build/win-smoke/PcPs4-v46-Core-Windows-Game-Diagnostic.pkg"

      - name: Upload PS4 package containing native Windows D3D11 smoke binary
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-Windows-D3D11-Smoke-PKG
          path: build/win-smoke/PcPs4-v46-Core-Windows-Game-Diagnostic.pkg
          if-no-files-found: error

      - name: Upload FINAL one-package PS4 Windows smoke
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-FINAL-Windows-Game-Diagnostic-PKG
          path: build/win-smoke/PcPs4-v46-Core-Windows-Game-Diagnostic.pkg
          if-no-files-found: error

      - name: Upload bundled GP4 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-PKG-Windows-D3D11-Smoke-Diagnostics
          path: |
            build/win-smoke/package/*.gp4
            build/win-smoke/package/game/game.exe
          if-no-files-found: error

      - name: Upload translated source and report
        uses: actions/upload-artifact@v4
        with:
          name: PcPs4-v46-Core-translated-source
          path: |
            build/generated/*.c
            build/generated/*.cpp
            build/translation.json
          if-no-files-found: error
